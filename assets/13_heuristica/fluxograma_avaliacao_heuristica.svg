<path d="M720,660 L770,660" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#seta)"/>
<path d="M990,660 L1040,660" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#seta)"/>
<path d="M1145,701 L1145,750" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#seta)"/>
<rect x="1090" y="750" width="110" height="50" rx="25" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="1145" y="780" font-size="15" text-anchor="middle">Fim</text>
