<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" font-family="Arial, Helvetica, sans-serif" fill="#1a1a1a">
<defs><marker id="seta" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1a1a1a"/></marker></defs>
<rect width="1280" height="850" fill="#ffffff"/>
<rect x="20" y="20" width="1240" height="170" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="20" y="190" width="1240" height="390" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="20" y="580" width="1240" height="250" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="20" y="20" width="170" height="170" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="20" y="190" width="170" height="390" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="20" y="580" width="170" height="250" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="105" y="100" font-size="15" font-weight="bold" text-anchor="middle">Preparação</text>
<text x="105" y="122" font-size="14" fill="#4d4d4d" text-anchor="middle">todos os avaliadores</text>
<text x="105" y="356" font-size="15" font-weight="bold" text-anchor="middle">Coleta de dados</text>
<text x="105" y="375" font-size="15" font-weight="bold" text-anchor="middle">e interpretação</text>
<text x="105" y="399" font-size="14" fill="#4d4d4d" text-anchor="middle">cada avaliador,</text>
<text x="105" y="417" font-size="14" fill="#4d4d4d" text-anchor="middle">individualmente</text>
<text x="105" y="680" font-size="15" font-weight="bold" text-anchor="middle">Consolidação</text>
<text x="105" y="699" font-size="15" font-weight="bold" text-anchor="middle">e relato dos</text>
<text x="105" y="718" font-size="15" font-weight="bold" text-anchor="middle">resultados</text>
<text x="105" y="742" font-size="14" fill="#4d4d4d" text-anchor="middle">todos os avaliadores</text>
<rect x="220" y="80" width="110" height="50" rx="25" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="275" y="110" font-size="15" text-anchor="middle">Início</text>
<rect x="380" y="65" width="250" height="80" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="505" y="101" font-size="15" text-anchor="middle">Estudar as heurísticas H1–H10</text>
<text x="505" y="120" font-size="15" text-anchor="middle">e as diretrizes de design</text>
<rect x="680" y="65" width="280" height="80" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="820" y="92" font-size="15" text-anchor="middle">Conhecer usuários e domínio:</text>
<text x="820" y="111" font-size="15" text-anchor="middle">personas P01–P04 e tarefas</text>
<text x="820" y="130" font-size="15" text-anchor="middle">de avaliação UT01–UT04</text>
<rect x="1015" y="65" width="235" height="80" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="1132" y="92" font-size="15" text-anchor="middle">Selecionar as partes da</text>
<text x="1132" y="111" font-size="15" text-anchor="middle">interface: 42 telas e</text>
<text x="1132" y="130" font-size="15" text-anchor="middle">estados dos fluxos M01–M04</text>
<path d="M330,105 L380,105" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#seta)"/>
<path d="M630,105 L680,105" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#seta)"/>
<path d="M960,105 L1015,105" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#seta)"/>
<path d="M1132,145 L1132,260" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#seta)"/>
<rect x="1015" y="260" width="235" height="80" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="1132" y="287" font-size="15" text-anchor="middle">Executar UT01–UT04 nos</text>
<text x="1132" y="306" font-size="15" text-anchor="middle">fluxos, na ordem do</text>
<text x="1132" y="325" font-size="15" text-anchor="middle">avaliador (familiarização)</text>
<rect x="735" y="260" width="240" height="80" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="855" y="287" font-size="15" text-anchor="middle">Aplicar H1–H10 a cada tela</text>
<text x="855" y="306" font-size="15" text-anchor="middle">e estado de um fluxo, no</text>
<text x="855" y="325" font-size="15" text-anchor="middle">lugar da persona do fluxo</text>
<path d="M1015,300 L975,300" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#seta)"/>
<polygon points="515,300 600,242 685,300 600,358" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="600" y="296" font-size="15" text-anchor="middle">Novo</text>
<text x="600" y="315" font-size="15" text-anchor="middle">problema?</text>
<path d="M735,300 L685,300" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#seta)"/>
<polygon points="255,300 345,242 435,300 345,358" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="345" y="296" font-size="15" text-anchor="middle">Restam</text>
<text x="345" y="315" font-size="15" text-anchor="middle">fluxos?</text>
<path d="M515,300 L435,300" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#seta)"/>
<text x="475" y="290" font-size="14" text-anchor="middle">não</text>
<path d="M600,358 L600,440" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#seta)"/>
<text x="610" y="405" font-size="14">sim</text>
<rect x="480" y="440" width="240" height="80" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="600" y="467" font-size="15" text-anchor="middle">Registrar a heurística</text>
<text x="600" y="486" font-size="15" text-anchor="middle">violada, o local, a evidência</text>
<text x="600" y="505" font-size="15" text-anchor="middle">e a recomendação</text>
<rect x="780" y="440" width="240" height="80" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="900" y="467" font-size="15" text-anchor="middle">Atribuir severidade 0–4,</text>
<text x="900" y="486" font-size="15" text-anchor="middle">justificada por frequência,</text>
<text x="900" y="505" font-size="15" text-anchor="middle">impacto e persistência</text>
<path d="M720,480 L780,480" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#seta)"/>
<path d="M900,440 L900,340" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#seta)"/>
<path d="M345,242 L345,215 L790,215 L790,260" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#seta)"/>
<text x="355" y="236" font-size="14">sim</text>
<path d="M345,358 L345,440" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#seta)"/>
<text x="355" y="405" font-size="14">não</text>
<rect x="240" y="440" width="210" height="80" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="345" y="467" font-size="15" text-anchor="middle">Fechar a matriz H1–H10,</text>
<text x="345" y="486" font-size="15" text-anchor="middle">com boa prática para cada</text>
<text x="345" y="505" font-size="15" text-anchor="middle">heurística sem violação</text>
<path d="M345,520 L345,610" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#seta)"/>
<rect x="235" y="610" width="220" height="100" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="345" y="637" font-size="15" text-anchor="middle">Reunir achados iguais</text>
<text x="345" y="656" font-size="15" text-anchor="middle">ou semelhantes em HC,</text>
<text x="345" y="675" font-size="15" text-anchor="middle">preservando quem os</text>
<text x="345" y="694" font-size="15" text-anchor="middle">encontrou</text>
<rect x="500" y="610" width="220" height="100" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="610" y="637" font-size="15" text-anchor="middle">Severidade final:</text>
<text x="610" y="656" font-size="15" text-anchor="middle">mediana arredondada</text>
<text x="610" y="675" font-size="15" text-anchor="middle">para cima; prioridade</text>
<text x="610" y="694" font-size="15" text-anchor="middle">alta, média ou baixa</text>
<rect x="770" y="610" width="220" height="100" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="880" y="646" font-size="15" text-anchor="middle">Definir correções</text>
<text x="880" y="665" font-size="15" text-anchor="middle">antes do piloto,</text>
<text x="880" y="684" font-size="15" text-anchor="middle">responsáveis e datas</text>
<path d="M1040,610 L1250,610 L1250,700 C1215,720 1180,680 1145,700 C1110,720 1075,680 1040,700 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="1145" y="639" font-size="15" text-anchor="middle">Relatório</text>
<text x="1145" y="658" font-size="15" text-anchor="middle">consolidado</text>
<text x="1145" y="677" font-size="15" text-anchor="middle">(seções 7 e 8)</text>
