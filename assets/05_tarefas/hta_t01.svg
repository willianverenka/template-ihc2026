<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" role="img" aria-labelledby="title">
  <title id="title">HTA - Avaliar hipótese diagnóstica</title>
  <defs>
    <style>text{font:16px Arial,sans-serif;fill:#222}rect{fill:white;stroke:#333;stroke-width:1.5}.line{fill:none;stroke:#333;stroke-width:1.5}</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#333"/></marker>
  </defs>
  <rect width="1000" height="455" style="stroke:none"/>
  <text x="25" y="30">HTA - Avaliação de hipótese diagnóstica</text>
  <rect x="320" y="55" width="360" height="65"/>
  <text x="500" y="81" text-anchor="middle"><tspan x="500">0. Avaliar a hipótese diagnóstica</tspan><tspan x="500" dy="24">1&gt;2&gt;3&gt;4&gt;5</tspan></text>
  <path class="line" d="M500 120 V150 M100 150 H900"/>
  <g marker-end="url(#arrow)" class="line"><path d="M100 150 V180"/><path d="M300 150 V180"/><path d="M500 150 V180"/><path d="M700 150 V180"/><path d="M900 150 V180"/></g>
  <rect x="15" y="180" width="170" height="65"/>
  <text x="100" y="207" text-anchor="middle"><tspan x="100">1. Entender</tspan><tspan x="100" dy="22">a hipótese</tspan></text>
  <path class="line" d="M15 253 H185"/>
  <rect x="215" y="180" width="170" height="65"/>
  <text x="300" y="204" text-anchor="middle"><tspan x="300">2. Conferir evidências</tspan><tspan x="300" dy="24">2.1&gt;2.2</tspan></text>
  <rect x="415" y="180" width="170" height="65"/>
  <text x="500" y="207" text-anchor="middle"><tspan x="500">3. Comparar</tspan><tspan x="500" dy="22">com o contexto</tspan></text>
  <path class="line" d="M415 253 H585"/>
  <rect x="615" y="180" width="170" height="65"/>
  <text x="700" y="207" text-anchor="middle"><tspan x="700">4. Classificar</tspan><tspan x="700" dy="22">a hipótese</tspan></text>
  <path class="line" d="M615 253 H785"/>
  <rect x="815" y="180" width="170" height="65"/>
  <text x="900" y="207" text-anchor="middle"><tspan x="900">5. Registrar</tspan><tspan x="900" dy="22">a decisão</tspan></text>
  <path class="line" d="M815 253 H985"/>
  <path class="line" d="M300 245 V285 M185 285 H415"/>
  <g marker-end="url(#arrow)" class="line"><path d="M185 285 V315"/><path d="M415 285 V315"/></g>
  <rect x="85" y="315" width="200" height="60"/>
  <text x="185" y="341" text-anchor="middle"><tspan x="185">2.1 Examinar</tspan><tspan x="185" dy="22">o subgrafo</tspan></text>
  <path class="line" d="M85 383 H285"/>
  <rect x="315" y="315" width="200" height="60"/>
  <text x="415" y="341" text-anchor="middle"><tspan x="415">2.2 Consultar</tspan><tspan x="415" dy="22">spans e logs</tspan></text>
  <path class="line" d="M315 383 H515"/>
  <text x="25" y="430" style="font-size:14px">Linha abaixo da caixa: operação. Se faltar evidência, repetir a conferência.</text>
</svg>
