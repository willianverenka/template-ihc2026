<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">CTT da tarefa T01</title>
  <desc id="desc">Modelo temporal da avaliação humana de uma hipótese diagnóstica, incluindo inspeção intercalada de evidências, retorno diante de lacunas e escolha entre sustentar, refinar ou rejeitar.</desc>
  <defs>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#172b4d}.subtitle{font:400 17px Arial,sans-serif;fill:#44546f}
      .abstract{fill:#fff3cd;stroke:#9a6b00;stroke-width:2}.user{fill:#e7f6ea;stroke:#27733c;stroke-width:2}.interaction{fill:#e8f1fb;stroke:#315b8a;stroke-width:2}.system{fill:#f1e9fb;stroke:#6d4298;stroke-width:2}
      .nodeText{font:600 15px Arial,sans-serif;fill:#172b4d}.small{font:400 14px Arial,sans-serif;fill:#172b4d}.op{font:700 20px Consolas,monospace;fill:#44546f}
      .edge{fill:none;stroke:#6b7f99;stroke-width:2.5}.loop{fill:none;stroke:#b45f06;stroke-width:3;stroke-dasharray:9 7}.condition{font:600 14px Arial,sans-serif;fill:#8a4b08}
      .legend{font:400 14px Arial,sans-serif;fill:#172b4d}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7f99"/></marker>
    <marker id="loopArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b45f06"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff"/>
  <text class="title" x="800" y="46" text-anchor="middle">CTT — T01 Avaliar hipótese diagnóstica e evidências</text>
  <text class="subtitle" x="800" y="75" text-anchor="middle">Autor: Gabriel Lovato — 22.123.004-8</text>

  <rect class="abstract" x="445" y="100" width="710" height="62" rx="9"/>
  <text class="nodeText" x="800" y="127" text-anchor="middle"><tspan x="800">0. Avaliar uma hipótese diagnóstica e decidir se ela é sustentada</tspan><tspan x="800" dy="20">[tarefa abstrata]</tspan></text>

  <rect class="interaction" x="25" y="225" width="190" height="78" rx="9"/>
  <text class="nodeText" x="120" y="252" text-anchor="middle"><tspan x="120">1. Acessar a</tspan><tspan x="120" dy="20">hipótese gerada</tspan><tspan class="small" x="120" dy="19">[interação]</tspan></text>
  <text class="op" x="235" y="272" text-anchor="middle">&gt;&gt;</text>
  <rect class="user" x="255" y="225" width="190" height="78" rx="9"/>
  <text class="nodeText" x="350" y="252" text-anchor="middle"><tspan x="350">2. Interpretar</tspan><tspan x="350" dy="20">a afirmação</tspan><tspan class="small" x="350" dy="19">[usuário]</tspan></text>
  <text class="op" x="465" y="272" text-anchor="middle">&gt;&gt;</text>
  <rect class="system" x="485" y="225" width="210" height="78" rx="9"/>
  <text class="nodeText" x="590" y="252" text-anchor="middle"><tspan x="590">3. Disponibilizar</tspan><tspan x="590" dy="20">evidências vinculadas</tspan><tspan class="small" x="590" dy="19">[sistema]</tspan></text>
  <text class="op" x="715" y="272" text-anchor="middle">&gt;&gt;</text>
  <rect class="abstract" x="735" y="225" width="230" height="78" rx="9"/>
  <text class="nodeText" x="850" y="252" text-anchor="middle"><tspan x="850">4. Inspecionar e comparar</tspan><tspan x="850" dy="20">evidências *</tspan><tspan class="small" x="850" dy="19">[abstrata]</tspan></text>
  <text class="op" x="985" y="272" text-anchor="middle">&gt;&gt;</text>
  <rect class="user" x="1005" y="225" width="210" height="78" rx="9"/>
  <text class="nodeText" x="1110" y="252" text-anchor="middle"><tspan x="1110">5. Confrontar com</tspan><tspan x="1110" dy="20">o contexto operacional</tspan><tspan class="small" x="1110" dy="19">[usuário]</tspan></text>
  <text class="op" x="1235" y="272" text-anchor="middle">&gt;&gt;</text>
  <rect class="user" x="1255" y="225" width="210" height="78" rx="9"/>
  <text class="nodeText" x="1360" y="252" text-anchor="middle"><tspan x="1360">6. Classificar</tspan><tspan x="1360" dy="20">a hipótese</tspan><tspan class="small" x="1360" dy="19">[usuário]</tspan></text>
  <path class="edge" d="M215 264 H255 M445 264 H485 M695 264 H735 M965 264 H1005 M1215 264 H1255" marker-end="url(#arrow)"/>

  <path class="edge" d="M850 303 V355 M585 355 H1115 M585 355 V395 M850 355 V395 M1115 355 V395"/>
  <rect class="interaction" x="485" y="395" width="200" height="70" rx="8"/>
  <text class="nodeText" x="585" y="422" text-anchor="middle"><tspan x="585">4.1 Examinar subgrafo</tspan><tspan class="small" x="585" dy="22">[interação]</tspan></text>
  <text class="op" x="717" y="438" text-anchor="middle">|||</text>
  <rect class="interaction" x="750" y="395" width="200" height="70" rx="8"/>
  <text class="nodeText" x="850" y="422" text-anchor="middle"><tspan x="850">4.2 Aprofundar spans</tspan><tspan class="small" x="850" dy="22">[interação]</tspan></text>
  <text class="op" x="982" y="438" text-anchor="middle">|||</text>
  <rect class="interaction" x="1015" y="395" width="200" height="70" rx="8"/>
  <text class="nodeText" x="1115" y="422" text-anchor="middle"><tspan x="1115">4.3 Consultar logs</tspan><tspan class="small" x="1115" dy="22">[interação]</tspan></text>

  <path class="edge" d="M1360 303 V370 M1270 370 H1450 M1270 370 V505 M1360 370 V505 M1450 370 V505"/>
  <text class="op" x="1495" y="420" text-anchor="middle">[]</text>
  <rect class="user" x="1180" y="505" width="180" height="65" rx="8"/>
  <text class="nodeText" x="1270" y="532" text-anchor="middle"><tspan x="1270">6.2 Refinar</tspan><tspan class="small" x="1270" dy="21">[usuário]</tspan></text>
  <rect class="user" x="1370" y="505" width="180" height="65" rx="8"/>
  <text class="nodeText" x="1460" y="532" text-anchor="middle"><tspan x="1460">6.3 Rejeitar</tspan><tspan class="small" x="1460" dy="21">[usuário]</tspan></text>
  <rect class="user" x="990" y="505" width="180" height="65" rx="8"/>
  <text class="nodeText" x="1080" y="532" text-anchor="middle"><tspan x="1080">6.1 Sustentar</tspan><tspan class="small" x="1080" dy="21">[usuário]</tspan></text>

  <path class="edge" d="M1080 570 V620 H1460 M1270 570 V620 M1460 570 V620 M1360 620 V665" marker-end="url(#arrow)"/>
  <rect class="interaction" x="1205" y="665" width="310" height="72" rx="9"/>
  <text class="nodeText" x="1360" y="692" text-anchor="middle"><tspan x="1360">7. Registrar justificativa e</tspan><tspan x="1360" dy="20">compartilhar a avaliação</tspan><tspan class="small" x="1360" dy="18">[interação]</tspan></text>

  <path class="loop" d="M1360 303 V335 H980 V785 H850 V475" marker-end="url(#loopArrow)"/>
  <text class="condition" x="1035" y="812" text-anchor="middle">lacuna ou contradição relevante: ampliar evidências e retomar 4 *</text>

  <rect class="abstract" x="125" y="840" width="1350" height="95" rx="9"/>
  <text class="nodeText" x="155" y="872">Expressão temporal principal</text>
  <text class="small" x="155" y="906">1 &gt;&gt; 2 &gt;&gt; 3 &gt;&gt; (4.1 ||| 4.2 ||| 4.3)* &gt;&gt; 5 &gt;&gt; [retomar 4 [] (6.1 [] 6.2 [] 6.3)] &gt;&gt; 7</text>

  <rect class="abstract" x="40" y="960" width="24" height="18"/><text class="legend" x="74" y="975">abstrata</text>
  <rect class="user" x="190" y="960" width="24" height="18"/><text class="legend" x="224" y="975">usuário</text>
  <rect class="interaction" x="330" y="960" width="24" height="18"/><text class="legend" x="364" y="975">interação</text>
  <rect class="system" x="490" y="960" width="24" height="18"/><text class="legend" x="524" y="975">sistema</text>
  <text class="legend" x="690" y="975">&gt;&gt; habilitação</text><text class="legend" x="850" y="975">||| intercalação</text><text class="legend" x="1035" y="975">[] escolha</text><text class="legend" x="1160" y="975">* iteração</text>
</svg>
