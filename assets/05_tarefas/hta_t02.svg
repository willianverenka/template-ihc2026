<title id="title">HTA T02 — Emitir um parecer sobre a verificação da correção</title><desc id="desc">Decomposição hierárquica em recuperar contexto, avaliar alcance, tratar lacunas, definir parecer e registrar e comunicar; planos incluem retornos, conclusão inconclusiva e reconhecimento de que o parecer ficou registrado e disponível.</desc>
