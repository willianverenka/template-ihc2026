<text x="720.0" y="137.5" text-anchor="middle" font-size="18" font-weight="bold"><tspan x="720.0" dy="0">0. Emitir parecer sobre a verificação</tspan><tspan x="720.0" dy="23">Conclusão, evidências e limites</tspan></text>
