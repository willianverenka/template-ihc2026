<text x="35" y="73" text-anchor="start" font-size="17" font-weight="normal"><tspan x="35" dy="0">Willian Verenka Oliveira Silva · P03 / C02 · Proposta de interação — 08/10/2026, revisada em 22/10/2026</tspan></text>
